services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nutrifuel
      MYSQL_USER: nutrifuel
      MYSQL_PASSWORD: nutrifuel-local-only
      MYSQL_ROOT_PASSWORD: local-root-only
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - nutrifuel_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nutrifuel_mysql_data:
